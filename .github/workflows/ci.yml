name: CI

on:
  push:
  pull_request:

env:
  # the app release it is tested against: the branch offering its plugin API (1.4)
  LIMINAL_REF: feature/collector

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "liminal @ git+https://github.com/pcxmac-dev/liminal@${{ env.LIMINAL_REF }}"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
